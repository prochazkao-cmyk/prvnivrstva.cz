<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Kontrola volného pohybu osy</title><desc id="d">Schéma osy s celým rozsahem pohybu a místem zvýšeného odporu.</desc><rect width="1200" height="675" fill="#101114"/><text x="70" y="90" fill="#fff" font-family="system-ui,sans-serif" font-size="46" font-weight="700">2. Ověřte volný pohyb v celém rozsahu</text><text x="70" y="138" fill="#b8bdc7" font-family="system-ui,sans-serif" font-size="25">Hledejte překážku, kabel, kus filamentu nebo místo s neobvykle vysokým odporem.</text><line x1="180" y1="355" x2="1020" y2="355" stroke="#64748b" stroke-width="20" stroke-linecap="round"/><rect x="410" y="285" width="170" height="140" rx="18" fill="#f59e0b"/><path d="M220 245h720" stroke="#fff" stroke-width="5"/><path d="m230 225-30 20 30 20M930 225l30 20-30 20" fill="none" stroke="#fff" stroke-width="5"/><circle cx="790" cy="355" r="52" fill="#ef4444" opacity=".25"/><path d="M760 325l60 60M820 325l-60 60" stroke="#ef4444" stroke-width="10"/><text x="705" y="460" fill="#ef4444" font-family="system-ui,sans-serif" font-size="26" font-weight="700">zadrhávání / překážka</text><text x="70" y="575" fill="#b8bdc7" font-family="system-ui,sans-serif" font-size="23">Kontrolu provádějte bezpečně a podle servisního postupu výrobce konkrétní tiskárny.</text></svg>