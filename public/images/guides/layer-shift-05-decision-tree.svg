<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Rozhodovací strom diagnostiky layer shiftu</title><desc id="d">Jednoduchý diagnostický strom od symptomu přes kolizi, volný pohyb, řemen a profil.</desc><rect width="1200" height="675" fill="#101114"/><text x="70" y="80" fill="#fff" font-family="system-ui,sans-serif" font-size="44" font-weight="700">Layer shift: rychlý diagnostický strom</text><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="420" y="120" width="360" height="70" rx="16" fill="#f59e0b"/><text x="600" y="164" fill="#111" font-size="25" font-weight="700">Ostrý posun horních vrstev?</text><path d="M600 190v45M600 235H270v45M600 235h330v45" stroke="#94a3b8" stroke-width="5" fill="none"/><rect x="90" y="280" width="360" height="78" rx="16" fill="#334155"/><text x="270" y="312" fill="#fff" font-size="22"><tspan x="270">Kolize / warping</tspan><tspan x="270" dy="27">těsně před shiftem?</tspan></text><rect x="750" y="280" width="360" height="78" rx="16" fill="#334155"/><text x="930" y="312" fill="#fff" font-size="22"><tspan x="930">Osa drhne nebo má</tspan><tspan x="930" dy="27">překážku?</tspan></text><path d="M270 358v55M930 358v55" stroke="#94a3b8" stroke-width="5"/><rect x="90" y="413" width="360" height="78" rx="16" fill="#1f2937"/><text x="270" y="445" fill="#fff" font-size="21"><tspan x="270">Řešit příčinu kolize</tspan><tspan x="270" dy="27">a stabilitu modelu</tspan></text><rect x="750" y="413" width="360" height="78" rx="16" fill="#1f2937"/><text x="930" y="445" fill="#fff" font-size="21"><tspan x="930">Odstranit překážku / servis</tspan><tspan x="930" dy="27">podle výrobce</tspan></text><path d="M600 235v310" stroke="#94a3b8" stroke-width="5"/><rect x="420" y="520" width="360" height="95" rx="16" fill="#334155"/><text x="600" y="552" fill="#fff" font-size="21"><tspan x="600">Mechanika OK?</tspan><tspan x="600" dy="26">Řemen + řemenice → standardní profil</tspan><tspan x="600" dy="26">→ modelově specifický servis</tspan></text></g></svg>