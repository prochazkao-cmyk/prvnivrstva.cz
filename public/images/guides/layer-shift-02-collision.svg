<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Kolize trysky před layer shiftem</title><desc id="d">Schéma trysky narážející do zvednutého rohu výtisku.</desc><rect width="1200" height="675" fill="#101114"/><text x="70" y="90" fill="#fff" font-family="system-ui,sans-serif" font-size="46" font-weight="700">1. Hledejte kolizi těsně před shiftem</text><text x="70" y="138" fill="#b8bdc7" font-family="system-ui,sans-serif" font-size="25">Warping, nakloněný support nebo nános materiálu může trysku fyzicky zastavit.</text><rect x="170" y="505" width="850" height="22" rx="11" fill="#64748b"/><path d="M285 505h470q80 0 135-105l40 105z" fill="#f59e0b"/><path d="M780 190h120l-25 170h-70z" fill="#d1d5db"/><path d="m820 360 20 55 20-55z" fill="#d1d5db"/><circle cx="842" cy="421" r="34" fill="none" stroke="#ef4444" stroke-width="8"/><path d="m870 450 75 75" stroke="#ef4444" stroke-width="8"/><text x="730" y="585" fill="#ef4444" font-family="system-ui,sans-serif" font-size="27" font-weight="700">zvednutý roh → riziko nárazu</text><text x="70" y="620" fill="#b8bdc7" font-family="system-ui,sans-serif" font-size="22">Nejdřív odstraňte příčinu kolize; dotažení řemenu warping nevyřeší.</text></svg>