<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Jak vypadá layer shift</title><desc id="d">Schéma modelu, jehož horní vrstvy se od určité výšky posunuly do strany.</desc><rect width="1200" height="675" fill="#101114"/><text x="70" y="90" fill="#fff" font-family="system-ui,sans-serif" font-size="46" font-weight="700">Jak poznat skutečný layer shift</text><text x="70" y="138" fill="#b8bdc7" font-family="system-ui,sans-serif" font-size="25">Ostrá hranice: spodní část sedí, horní pokračuje posunutá do strany.</text><g fill="#f59e0b"><rect x="330" y="430" width="380" height="70" rx="8"/><rect x="330" y="355" width="380" height="70" rx="8"/><rect x="330" y="280" width="380" height="70" rx="8"/></g><g fill="#ffb52e"><rect x="445" y="205" width="380" height="70" rx="8"/><rect x="445" y="130" width="380" height="70" rx="8"/></g><path d="M735 245h250" stroke="#fff" stroke-width="5"/><path d="m970 225 30 20-30 20" fill="none" stroke="#fff" stroke-width="5"/><text x="845" y="205" fill="#fff" font-family="system-ui,sans-serif" font-size="25">posun X/Y</text><path d="M265 277h550" stroke="#ef4444" stroke-width="4" stroke-dasharray="14 12"/><text x="70" y="290" fill="#ef4444" font-family="system-ui,sans-serif" font-size="24">místo ztráty polohy</text><text x="70" y="595" fill="#b8bdc7" font-family="system-ui,sans-serif" font-size="22">Ilustrační schéma • nejedná se o měření ani fotografii testu</text></svg>