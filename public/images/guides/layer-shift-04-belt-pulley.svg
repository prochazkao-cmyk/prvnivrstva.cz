<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Řemen a řemenice při diagnostice layer shiftu</title><desc id="d">Schéma připomínající kontrolu řemenu a motorové řemenice podle dokumentace výrobce.</desc><rect width="1200" height="675" fill="#101114"/><text x="70" y="90" fill="#fff" font-family="system-ui,sans-serif" font-size="46" font-weight="700">3. Řemen a řemenice: nehádejte hodnoty</text><text x="70" y="138" fill="#b8bdc7" font-family="system-ui,sans-serif" font-size="25">Příliš volný i příliš napnutý řemen může být problém. Postup je modelově specifický.</text><circle cx="330" cy="355" r="105" fill="#334155" stroke="#f59e0b" stroke-width="18"/><circle cx="870" cy="355" r="105" fill="#334155" stroke="#f59e0b" stroke-width="18"/><path d="M330 250h540M330 460h540" stroke="#f59e0b" stroke-width="24"/><circle cx="870" cy="355" r="28" fill="#cbd5e1"/><path d="M870 327v56" stroke="#101114" stroke-width="9"/><text x="170" y="535" fill="#fff" font-family="system-ui,sans-serif" font-size="25">napnutí: podle návodu / belt tuneru výrobce</text><text x="690" y="535" fill="#fff" font-family="system-ui,sans-serif" font-size="25">řemenice: ověřit upevnění</text><text x="70" y="610" fill="#ef4444" font-family="system-ui,sans-serif" font-size="23" font-weight="700">Neutahujte řemen „co nejvíc“ a nekopírujte hodnotu z jiné konstrukce.</text></svg>