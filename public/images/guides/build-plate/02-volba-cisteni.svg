<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><text x="60" y="80" font-family="Arial" font-size="48" font-weight="700">Čím čistit PEI?</text><g font-family="Arial"><rect x="70" y="145" width="300" height="360" rx="28" fill="#eaf4ff"/><text x="120" y="215" font-size="34" font-weight="700">IPA ~90 %</text><text x="105" y="285" font-size="26">Běžné odmaštění</text><text x="105" y="330" font-size="26">Hladký / satin / textured</text><rect x="450" y="145" width="300" height="360" rx="28" fill="#edf8ef"/><text x="495" y="215" font-size="34" font-weight="700">Voda + saponát</text><text x="485" y="285" font-size="26">Když IPA nestačí</text><text x="485" y="330" font-size="26">Opláchnout a vysušit</text><rect x="830" y="145" width="300" height="360" rx="28" fill="#fff1ee"/><text x="900" y="215" font-size="34" font-weight="700">Aceton</text><text x="865" y="285" font-size="26">Jen hladký Prusa PEI</text><text x="865" y="330" font-size="26">Pouze občas</text><text x="865" y="375" font-size="26" font-weight="700">NE satin / textured</text><text x="60" y="620" font-size="22" fill="#555">Schéma podle dokumentace výrobce • První Vrstva</text></g></svg>