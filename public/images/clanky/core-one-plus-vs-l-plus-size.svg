<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">CORE One+ vs CORE One L+ – srovnání pracovního prostoru</title><desc id="desc">Redakční schéma porovnává výrobcem deklarované pracovní prostory 250 × 220 × 270 mm a 300 × 300 × 330 mm.</desc><rect width="1200" height="675" fill="#111827"/><text x="70" y="85" fill="#fff" font-family="system-ui,sans-serif" font-size="42" font-weight="700">CORE One+ vs. CORE One L+</text><text x="70" y="128" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="24">Pracovní prostor podle specifikací Prusa Research</text><g fill="none" stroke="#e5e7eb" stroke-width="5"><rect x="120" y="245" width="350" height="308" rx="10"/><rect x="650" y="175" width="420" height="378" rx="10"/></g><g font-family="system-ui,sans-serif" fill="#fff"><text x="120" y="205" font-size="30" font-weight="700">CORE One+</text><text x="650" y="135" font-size="30" font-weight="700">CORE One L+</text><text x="155" y="410" font-size="32" font-weight="700">250 × 220 × 270 mm</text><text x="690" y="385" font-size="32" font-weight="700">300 × 300 × 330 mm</text></g><g font-family="system-ui,sans-serif" fill="#94a3b8" font-size="20"><text x="120" y="610">Redakční ilustrace • není v měřítku</text><text x="650" y="610">Zdroj hodnot: Prusa Research</text></g></svg>