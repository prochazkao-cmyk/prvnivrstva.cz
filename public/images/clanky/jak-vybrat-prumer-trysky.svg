<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Jak vybrat průměr trysky</title><desc id="desc">Redakční rozhodovací schéma pro trysky 0,25, 0,4, 0,6 a 0,8 mm.</desc><rect width="1200" height="675" fill="#111827"/><text x="70" y="82" fill="#fff" font-family="system-ui,sans-serif" font-size="42" font-weight="700">Jak vybrat průměr trysky?</text><text x="70" y="126" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="23">Začněte tím, co je na modelu nejdůležitější</text><g font-family="system-ui,sans-serif"><g><rect x="70" y="190" width="245" height="300" rx="18" fill="#1f2937"/><text x="95" y="250" fill="#fff" font-size="34" font-weight="700">0,25 mm</text><text x="95" y="305" fill="#e5e7eb" font-size="22">Jemné detaily</text><text x="95" y="340" fill="#e5e7eb" font-size="22">malé nápisy</text><text x="95" y="375" fill="#e5e7eb" font-size="22">miniatury</text></g><g><rect x="340" y="190" width="245" height="300" rx="18" fill="#1f2937"/><text x="365" y="250" fill="#fff" font-size="34" font-weight="700">0,4 mm</text><text x="365" y="305" fill="#e5e7eb" font-size="22">Univerzální</text><text x="365" y="340" fill="#e5e7eb" font-size="22">výchozí volba</text></g><g><rect x="610" y="190" width="245" height="300" rx="18" fill="#1f2937"/><text x="635" y="250" fill="#fff" font-size="34" font-weight="700">0,6 mm</text><text x="635" y="305" fill="#e5e7eb" font-size="22">Větší funkční</text><text x="635" y="340" fill="#e5e7eb" font-size="22">díly a vyšší</text><text x="635" y="375" fill="#e5e7eb" font-size="22">vrstvy</text></g><g><rect x="880" y="190" width="245" height="300" rx="18" fill="#1f2937"/><text x="905" y="250" fill="#fff" font-size="34" font-weight="700">0,8 mm</text><text x="905" y="305" fill="#e5e7eb" font-size="22">Velké modely</text><text x="905" y="340" fill="#e5e7eb" font-size="22">robustní stopa</text></g><text x="70" y="555" fill="#94a3b8" font-size="20">Redakční schéma • není výsledkem vlastního fyzického testu</text><text x="70" y="590" fill="#94a3b8" font-size="20">Zdroj doporučení: dokumentace Prusa Research</text></g></svg>