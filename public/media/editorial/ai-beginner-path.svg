<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tři otázky před první 3D tiskárnou</title>
  <desc id="desc">Ilustrační rozhodovací cesta pro začátečníka: co bude tisknout, kde bude tisknout a kolik údržby chce řešit.</desc>
  <rect width="1200" height="675" rx="36" fill="#edf2ee"/>
  <text x="72" y="72" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#0a7c68">PRVNÍ TISKÁRNA · 3 OTÁZKY</text>
  <text x="72" y="142" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#181614">Začátečník nepotřebuje nejvíc funkcí.</text>
  <text x="72" y="184" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#5d5751">Potřebuje stroj, který odpovídá tomu, co bude opravdu tisknout.</text>

  <path d="M160 350H1040" stroke="#0aa889" stroke-width="8" stroke-linecap="round" opacity=".25"/>
  <circle cx="220" cy="350" r="66" fill="#0aa889"/>
  <circle cx="600" cy="350" r="66" fill="#ff6b35"/>
  <circle cx="980" cy="350" r="66" fill="#181614"/>
  <text x="220" y="365" text-anchor="middle" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#fff">1</text>
  <text x="600" y="365" text-anchor="middle" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#fff">2</text>
  <text x="980" y="365" text-anchor="middle" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#fff">3</text>

  <text x="220" y="462" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0a7c68">CO CHCI TISKNOUT?</text>
  <text x="220" y="498" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#181614">PLA/PETG nebo ASA?</text>
  <text x="220" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5d5751">Materiál určuje konstrukci.</text>

  <text x="600" y="462" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#c24d21">KDE BUDE STÁT?</text>
  <text x="600" y="498" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#181614">Pokoj, dílna, kancelář?</text>
  <text x="600" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5d5751">Hluk, prostor a komora hrají roli.</text>

  <text x="980" y="462" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#181614">KOLIK CHCI ŘEŠIT?</text>
  <text x="980" y="498" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#181614">Tisknout, nebo ladit?</text>
  <text x="980" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5d5751">Automatizace šetří čas, servis šetří nervy.</text>

  <rect x="72" y="586" width="1056" height="1" fill="#181614" opacity=".12"/>
  <text x="72" y="624" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#766f68">Ilustrační redakční grafika · není fotografií produktu ani výsledkem testu</text>
</svg>