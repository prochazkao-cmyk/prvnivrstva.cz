<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Mapa materiálů pro 3D tisk</title><desc id="d">Redakční orientační mapa PLA, PETG, ASA a TPU podle typického použití.</desc><rect width="1200" height="675" rx="36" fill="#f3f1ec"/><text x="70" y="90" font-family="Arial" font-size="34" font-weight="700" fill="#17191d">MATERIÁL ZAČÍNÁ POUŽITÍM</text><g font-family="Arial" font-size="28" font-weight="700"><rect x="70" y="150" width="240" height="330" rx="28" fill="#fff"/><text x="105" y="210" fill="#17191d">PLA</text><text x="105" y="265" font-size="20" font-weight="400" fill="#555">snadný tisk</text><text x="105" y="300" font-size="20" font-weight="400" fill="#555">modely · prototypy</text><rect x="335" y="150" width="240" height="330" rx="28" fill="#fff"/><text x="370" y="210" fill="#17191d">PETG</text><text x="370" y="265" font-size="20" font-weight="400" fill="#555">houževnatost</text><text x="370" y="300" font-size="20" font-weight="400" fill="#555">funkční díly</text><rect x="600" y="150" width="240" height="330" rx="28" fill="#fff"/><text x="635" y="210" fill="#17191d">ASA</text><text x="635" y="265" font-size="20" font-weight="400" fill="#555">venkovní použití</text><text x="635" y="300" font-size="20" font-weight="400" fill="#555">chce komoru</text><rect x="865" y="150" width="240" height="330" rx="28" fill="#fff"/><text x="900" y="210" fill="#17191d">TPU</text><text x="900" y="265" font-size="20" font-weight="400" fill="#555">pružnost</text><text x="900" y="300" font-size="20" font-weight="400" fill="#555">tlumení · grip</text></g><path d="M100 535h1000" stroke="#ff6b35" stroke-width="8" stroke-linecap="round"/><text x="70" y="620" font-family="Arial" font-size="20" fill="#666">Redakční orientační ilustrace · konkrétní parametry ověřte v článku</text></svg>