<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="36" fill="#111827"/><text x="70" y="80" fill="#fff" font-family="system-ui" font-size="38" font-weight="700">Pět otázek před nákupem</text><g font-family="system-ui" font-size="25" fill="#fff"><g><circle cx="105" cy="165" r="24" fill="#f97316"/><text x="105" y="174" text-anchor="middle" font-weight="700">1</text><text x="150" y="174">Jaké materiály opravdu tisknu?</text></g><g><circle cx="105" cy="245" r="24" fill="#f97316"/><text x="105" y="254" text-anchor="middle" font-weight="700">2</text><text x="150" y="254">Potřebuji uzavřenou komoru?</text></g><g><circle cx="105" cy="325" r="24" fill="#f97316"/><text x="105" y="334" text-anchor="middle" font-weight="700">3</text><text x="150" y="334">Budu stroj opravovat sám?</text></g><g><circle cx="105" cy="405" r="24" fill="#f97316"/><text x="105" y="414" text-anchor="middle" font-weight="700">4</text><text x="150" y="414">Chci multi-color workflow?</text></g><g><circle cx="105" cy="485" r="24" fill="#f97316"/><text x="105" y="494" text-anchor="middle" font-weight="700">5</text><text x="150" y="494">Vadí mi cloud a účet?</text></g><rect x="710" y="155" width="390" height="355" rx="28" fill="#fff"/><text x="905" y="225" text-anchor="middle" fill="#111827" font-size="28" font-weight="700">Výsledek</text><text x="905" y="290" text-anchor="middle" fill="#374151" font-size="22">Nejde o vítěze značek.</text><text x="905" y="335" text-anchor="middle" fill="#374151" font-size="22">Jde o menší tření</text><text x="905" y="380" text-anchor="middle" fill="#374151" font-size="22">ve vašem workflow.</text></g></svg>